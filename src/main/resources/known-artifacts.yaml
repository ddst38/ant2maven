# Known artifacts mapping for Ant to Maven migration
# ===================================================
#
# FORMAT: La clé est le SHA1 du fichier JAR (en minuscules)
# Cela garantit une correspondance exacte, quel que soit le nom du fichier.
#
# Pour obtenir le SHA1 d'un JAR :
#   sha1sum mon-fichier.jar
#   ou sur Mac: shasum -a 1 mon-fichier.jar
#
# Structure:
#   <sha1>:
#     groupId: <groupId Maven>
#     artifactId: <artifactId Maven>
#     version: <version>
#     jarName: <nom original du fichier (pour documentation)>
#     note: <commentaire optionnel>
#
# IMPORTANT: La plupart des bibliothèques standard sont automatiquement
# trouvées sur Maven Central par leur SHA1. Ce fichier n'est nécessaire que pour:
# - Les JARs modifiés/repackagés non présents sur Maven Central
# - Les JARs avec des coordonnées Maven différentes du nom de fichier
# - Les cas où la recherche SHA1 sur Maven Central échoue

knownArtifacts:
  # Exemple de format avec SHA1 comme clé
  # =====================================
  #
  # abc123def456789...:  # SHA1 du fichier JAR
  #   groupId: org.example
  #   artifactId: my-library
  #   version: "1.0.0"
  #   jarName: my-library.jar  # Pour référence
  #   note: "Description optionnelle"

  # Les entrées ci-dessous sont des exemples commentés.
  # Décommentez et ajoutez le SHA1 réel quand vous rencontrez un JAR
  # qui n'est pas trouvé sur Maven Central.

  # Oracle JDBC - Exemple avec SHA1 réel
  # Le SHA1 dépend de la version exacte du driver Oracle
  # Décommentez et ajustez le SHA1 selon votre version
  #
  # <sha1-de-votre-classes12.jar>:
  #   groupId: com.oracle.database.jdbc
  #   artifactId: ojdbc8
  #   version: 12.2.0.1
  #   jarName: classes12.jar
  #   scope: provided
  #   note: "Oracle JDBC - requires manual download from Oracle"

